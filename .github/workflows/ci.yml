name: Validate services

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - backend
          - frontend
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api
      - if: matrix.directory == 'backend'
        run: npm test

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wholedonuts_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wholedonuts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wholedonuts_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wholedonuts_test
      CRUMB_SAVER_REWARDS_ENABLED: "true"
      REWARD_REFERENCE_SALT: integration-test-reward-reference-salt
      REWARDS_PRIVACY_NOTICE_VERSION: 2026-09
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
