services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URLS: ${FRONTEND_URLS}
      JWT_SECRET: ${JWT_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY}
      CRUMB_SAVER_REWARDS_ENABLED: ${CRUMB_SAVER_REWARDS_ENABLED:-false}
      REFERRAL_ANALYTICS_ENABLED: ${REFERRAL_ANALYTICS_ENABLED:-false}
      REWARD_REFERENCE_SALT: ${REWARD_REFERENCE_SALT}
      REWARDS_PRIVACY_NOTICE_VERSION: ${REWARDS_PRIVACY_NOTICE_VERSION}
      REFERRAL_RETENTION_DAYS: ${REFERRAL_RETENTION_DAYS:-365}
      INTEGRATION_EVENT_RETENTION_DAYS: ${INTEGRATION_EVENT_RETENTION_DAYS:-30}
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      SHOPIFY_WEBHOOK_TOPICS: ${SHOPIFY_WEBHOOK_TOPICS}
      FULFILLMENT_PROVIDERS: ${FULFILLMENT_PROVIDERS:-printful}
      DEFAULT_FULFILLMENT_PROVIDER: ${DEFAULT_FULFILLMENT_PROVIDER:-printful}
      PRINTFUL_API_KEY: ${PRINTFUL_API_KEY}
      PRINTIFY_API_KEY: ${PRINTIFY_API_KEY}
      PRINTIFY_SHOP_ID: ${PRINTIFY_SHOP_ID}
    expose:
      - "3001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      - api
    expose:
      - "3000"
